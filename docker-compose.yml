services:
  mongo:
    image: mongo:8
    container_name: clip-mongo
    restart: unless-stopped
    volumes:
      - clip-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  clip-server:
    build: ./server
    container_name: clip-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

    # 127.0.0.1 on purpose. This endpoint writes files to your disk; it has no
    # business being reachable from the rest of your network.
    ports:
      - "127.0.0.1:${CLIP_PORT:-8765}:8765"

    environment:
      CLIP_LOG_LEVEL: "${CLIP_LOG_LEVEL:-INFO}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      MONGO_URL: "mongodb://mongo:27017"
      MONGO_DATABASE: "${MONGO_DATABASE:-clipstack}"
      OCR_ENABLED: "${OCR_ENABLED:-true}"
      OCR_BASE_URL: "${OCR_BASE_URL:-http://mineru-ocr:8766}"
      OCR_API_KEY: "${OCR_API_KEY:-}"
      OCR_TIMEOUT: "${OCR_TIMEOUT:-300}"
      OCR_MAX_IMAGES: "${OCR_MAX_IMAGES:-10}"
      OCR_MIN_IMAGE_BYTES: "${OCR_MIN_IMAGE_BYTES:-4096}"
      OCR_IMAGE_ANALYSIS: "${OCR_IMAGE_ANALYSIS:-false}"

    volumes:
      # Your notes folder. Everything the server writes lands under here.
      - ${VAULT_PATH:?set VAULT_PATH in .env}:/vault
      # Rules and custom templates. Read-only: the server never edits them.
      - ./server/config:/config:ro
    networks:
      - default
      - local-ai

  clip-frontend:
    build:
      context: ./frontend
      args:
        # Used by the visitor's browser, so this points at the host API port.
        VITE_API_URL: "http://127.0.0.1:${CLIP_PORT:-8765}"
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}"
    container_name: clip-frontend
    restart: unless-stopped
    depends_on:
      - clip-server
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"

volumes:
  clip-mongo-data:

networks:
  local-ai:
    name: local-ai
    external: true
